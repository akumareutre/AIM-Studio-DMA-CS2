# Valeurs par défaut pour une nouvelle installation.
# PORT=auto détecte une KMBox USB série ; préciser un chemin si plusieurs sont branchées.
PORT=auto
BAUD=115200
WIDTH=1920
HEIGHT=1080
MODE=magnetic
BODY=head
# 0 : sensibilité lue dans le jeu. Une valeur calibrée peut être renseignée ici.
SENSITIVITY=0
M_YAW=0.022
M_PITCH=0.022
DEVICE=fpga
# LANG_CODE=fr  # fr, en, es, de, it ou pt — langue du journal des lanceurs/moteur
# MEMMAP=/chemin/vers/memmap.txt
